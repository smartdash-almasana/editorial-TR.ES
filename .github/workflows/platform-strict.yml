name: Platform strict integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: Install platform
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./platform[dev]"

      - name: Compile every Python module
        working-directory: platform
        run: python -m compileall -q src

      - name: Run executable CLI subprocess test
        working-directory: platform
        run: python -m pytest tests/test_private_factory_cli.py -q

      - name: Run platform suite
        working-directory: platform
        run: python -m pytest -q

      - name: Run strict platform suite
        working-directory: platform
        run: python -m pytest -W error -q

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --check --root -r "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}..${{ github.sha }}"
          fi
