schema_version: editorial.tres/cycle-v1
id: PF-0
capability: editorial.private-factory-pilot
objective: demonstrate_governed_private_editorial_flow_to_appbook_package_and_html_v1
status: CLOSED_PASS

allowed_paths:
  - capabilities/private-factory-pilot/**
  - ops/ACTIVE_TASK.yaml
  - platform/tests/pilots/test_private_editorial_factory_v1.py
  - docs/architecture/EDITORIAL_TRES_ENGINEERING_STATE.md

forbidden_paths:
  - AGENTS.md
  - tools/**
  - capabilities/global-repetition/**
  - capabilities/edition-slice/**
  - platform/src/**
  - platform/tests/lab_experiment_001_casa_del_rio.py
  - platform/tests/lab_real_text_001_el_hambre_de_los_muertos.py
  - platform/tests/lab_real_text_002_el_perro_mas_listo.py
  - platform/tests/lab_real_text_003_corazon_piedra_verde.py
  - plugins/**
  - projects/**
  - constitution/**
  - .github/**
  - platform/pyproject.toml

change_budget:
  max_production_files: 0
  max_new_dependencies: 0
  domain_schema_changes: false
  event_schema_changes: false

dependencies: []
providers: []

verification:
  - name: private-factory-pilot-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/pilots/test_private_editorial_factory_v1.py
      - tests/application/test_review_persistence.py
      - tests/application/test_apply_approved_patch.py
      - tests/domain/test_llm_repetition_reviewer.py
      - tests/application/test_edition_projector.py
      - tests/application/test_app_book_compiler.py
      - tests/infrastructure/test_html_edition_renderer.py
      - -q
  - name: platform-suite-strict
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - -W
      - error
      - -q

permissions:
  commit: false
  push: false

deliverables:
  - one governed end-to-end pilot using original test material
  - Work to ReviewFinding and explicit human decisions
  - accepted finding to Patch, ApprovalGate and applied editorial change
  - rejected finding preserved without changing the Work
  - approved Work to EditionSnapshot, AppBookPackage v1 and readable HTML
  - integrity and provenance assertions across the complete path
  - engineering-state and evidence updates after successful verification

completion:
  requires_all_verification: true
  evidence_update: manual
  advance_next_cycle: false
