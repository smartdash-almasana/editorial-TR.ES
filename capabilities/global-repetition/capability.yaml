schema_version: editorial.tres/capability-v1
id: editorial.global-repetition
title: Detección global de reiteraciones
status: EXPERIMENTAL
category: reviewer

invariants:
  - never_mutates_work
  - preserves_original_text
  - binds_to_manuscript_version
  - requires_human_classification
  - never_creates_patch_directly
  - verifies_every_quote_against_source
  - rejects_multiblock_direct_edit

dependencies:
  - review-engine
  - plugin-runtime
  - capability-factory

forbidden:
  - automatic_rewrite
  - automatic_editorial_decision
  - direct_patch_creation
  - silent_truncation
  - ui
  - new_database
