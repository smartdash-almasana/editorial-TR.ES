schema_version: editorial.tres/cycle-v1
id: GR-1
capability: editorial.global-repetition
objective: integrate_experimental_llm_global_repetition_reviewer_v1
status: CLOSED_PASS

allowed_paths:
  - capabilities/global-repetition/**
  - ops/ACTIVE_TASK.yaml
  - docs/architecture/LLM_GLOBAL_REPETITION_REVIEW_V1.md
  - platform/src/editorial_tres/capability_factory.py
  - platform/src/editorial_tres/domain/editorial_passes.py
  - platform/src/editorial_tres/domain/reviews.py
  - platform/src/editorial_tres/domain/llm_repetition.py
  - platform/src/editorial_tres/infrastructure/gemini_structured_llm.py
  - platform/tests/domain/test_editorial_passes.py
  - platform/tests/domain/test_literary_reviewers.py
  - platform/tests/domain/test_llm_repetition_reviewer.py
  - platform/tests/infrastructure/test_gemini_structured_llm.py
  - platform/tests/test_capability_factory.py
  - plugins/reviewers/llm-global-repetition/**

forbidden_paths:
  - AGENTS.md
  - tools/**
  - platform/src/editorial_tres/application/**
  - platform/src/editorial_tres/plugin_runtime.py
  - platform/pyproject.toml
  - platform/tests/lab_experiment_001_casa_del_rio.py
  - platform/tests/lab_real_text_001_el_hambre_de_los_muertos.py
  - platform/tests/lab_real_text_002_el_perro_mas_listo.py
  - platform/tests/lab_real_text_003_corazon_piedra_verde.py
  - projects/**
  - constitution/**
  - .github/**

change_budget:
  max_production_files: 7
  max_new_dependencies: 0
  domain_schema_changes: true
  event_schema_changes: false

dependencies: []
providers:
  - google

verification:
  - name: global-repetition-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_llm_repetition_reviewer.py
      - tests/infrastructure/test_gemini_structured_llm.py
      - tests/test_capability_factory.py
      - tests/domain/test_editorial_passes.py
      - tests/domain/test_literary_reviewers.py
      - tests/test_plugin_runtime.py
      - -q
  - name: platform-suite-strict
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - -W
      - error
      - -q

permissions:
  commit: true
  push: true

deliverables:
  - provider-neutral LLM repetition reviewer
  - Gemini structured-output adapter
  - verified multiblock findings
  - direct-patch safety boundary
  - plugin and capability-factory integration
  - focused and strict regression evidence

completion:
  requires_all_verification: true
  evidence_update: manual
  advance_next_cycle: false
