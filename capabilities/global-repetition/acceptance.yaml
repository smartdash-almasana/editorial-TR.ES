schema_version: editorial.tres/acceptance-v1
capability: editorial.global-repetition
criteria:
  - id: structured_output_is_typed
    description: La respuesta LLM se valida contra modelos cerrados antes de producir hallazgos.
    observable: Payloads inválidos son rechazados por validación.
    required: true
  - id: evidence_is_source_verifiable
    description: Toda cita debe existir literalmente en el bloque declarado.
    observable: Una cita inventada o un bloque inexistente falla explícitamente.
    required: true
  - id: findings_are_multiblock
    description: Cada candidato global abarca al menos dos bloques distintos.
    observable: Clusters de un solo bloque o apariciones duplicadas son rechazados.
    required: true
  - id: manuscript_scope_is_preserved
    description: El hallazgo conserva tenant, editorial, obra, rama y versión material.
    observable: ReviewFinding queda ligado al mismo scope y manuscript_version de la entrada.
    required: true
  - id: provider_is_behind_port
    description: El dominio depende de StructuredLLMPort y no de Gemini.
    observable: El reviewer se prueba con un fake provider-neutral.
    required: true
  - id: gemini_adapter_matches_official_contract
    description: El adaptador genera una solicitud REST con salida JSON estructurada.
    observable: El test de transporte comprueba endpoint, headers, schema, timeout y parseo.
    required: true
  - id: reviewer_is_non_destructive
    description: La revisión no modifica Work ni crea Patch.
    observable: La salida se limita a ReviewFinding y la obra de entrada permanece igual.
    required: true
  - id: multiblock_patch_is_blocked
    description: Un hallazgo multibloque no puede alimentar una edición simple.
    observable: FindingDrivenBlockEditPass rechaza related_target_ids múltiples.
    required: true
  - id: plugin_is_resolvable
    description: El manifest declara llm_global_repetition y la fábrica lo construye explícitamente.
    observable: CapabilityFactoryRegistry resuelve el implementation_id con proveedor autorizado.
    required: true
  - id: limits_fail_explicitly
    description: Los límites de bloques y caracteres no truncan silenciosamente.
    observable: Superar max_blocks o max_characters produce un error gobernado.
    required: true
  - id: no_live_provider_in_tests
    description: La validación automática no consume red, API key ni costo del proveedor.
    observable: Los tests usan transporte y LLM simulados.
    required: true
  - id: regression_remains_green
    description: La plataforma conserva sus contratos vecinos.
    observable: La suite estricta declarada finaliza sin fallos ni warnings.
    required: true
