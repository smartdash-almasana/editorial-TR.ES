schema_version: editorial.tres/acceptance-v1
capability: editorial.global-repetition
criteria:
  - id: capability_valid
    description: La declaración de capacidad cumple su schema cerrado.
    observable: El guard carga capability.yaml sin errores de validación.
    required: true
  - id: cycle_valid
    description: El ciclo GR-0 cumple su schema cerrado.
    observable: El guard carga GR-0.yaml sin errores de validación.
    required: true
  - id: active_task_resolves_cycle
    description: ACTIVE_TASK referencia y resuelve el único ciclo autorizado.
    observable: El guard obtiene GR-0 desde cycle_file y valida su coherencia.
    required: true
  - id: identifier_mismatch_fails
    description: Las divergencias de task_id o capability se rechazan.
    observable: El guard termina con error concreto ante cualquier mismatch.
    required: true
  - id: path_escape_fails
    description: Ningún cycle_file puede escapar de capabilities.
    observable: Rutas absolutas, traversal y rutas externas son rechazadas.
    required: true
  - id: out_of_scope_diff_fails
    description: Un cambio fuera de allowed_paths queda bloqueado.
    observable: evaluate_task informa la ruta fuera de alcance y falla.
    required: true
  - id: forbidden_path_fails
    description: Un path explícitamente prohibido queda bloqueado.
    observable: evaluate_task informa la ruta prohibida y falla.
    required: true
  - id: change_budget_fails_closed
    description: El guard aplica el presupuesto de cambio declarado.
    observable: Exceder archivos productivos o dependencias permitidas bloquea el ciclo.
    required: true
  - id: dependencies_are_guarded
    description: Los manifiestos de dependencias no pueden cambiar sin presupuesto.
    observable: Un cambio de dependencia con max_new_dependencies igual a cero falla.
    required: true
  - id: commit_push_forbidden
    description: Commit y push permanecen prohibidos en GR-0.
    observable: intent commit e intent push retornan bloqueo.
    required: true
  - id: guard_is_read_only
    description: El guard no modifica archivos al validar.
    observable: El digest del repositorio es idéntico antes y después del check.
    required: true
  - id: no_automatic_advance
    description: El siguiente ciclo no se activa automáticamente.
    observable: completion.advance_next_cycle permanece false y sólo existe GR-0.
    required: true
