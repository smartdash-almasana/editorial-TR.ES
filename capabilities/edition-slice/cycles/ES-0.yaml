schema_version: editorial.tres/cycle-v1
id: ES-0
capability: editorial.edition-publication
objective: project_approved_work_to_edition_snapshot_appbook_package_and_html_v1
status: CLOSED_PASS

allowed_paths:
  - capabilities/edition-slice/**
  - ops/ACTIVE_TASK.yaml
  - platform/src/editorial_tres/domain/edition.py
  - platform/src/editorial_tres/application/edition_projector.py
  - platform/src/editorial_tres/application/app_book_compiler.py
  - platform/src/editorial_tres/infrastructure/html_edition_renderer.py
  - platform/tests/domain/test_edition.py
  - platform/tests/application/test_edition_projector.py
  - platform/tests/application/test_app_book_compiler.py
  - platform/tests/infrastructure/test_html_edition_renderer.py

forbidden_paths:
  - AGENTS.md
  - tools/**
  - capabilities/global-repetition/**
  - platform/tests/lab_experiment_001_casa_del_rio.py
  - platform/tests/lab_real_text_001_el_hambre_de_los_muertos.py
  - platform/tests/lab_real_text_002_el_perro_mas_listo.py
  - platform/tests/lab_real_text_003_corazon_piedra_verde.py
  - plugins/**
  - projects/**
  - constitution/**
  - .github/**
  - platform/pyproject.toml
  - docs/architecture/**

change_budget:
  max_production_files: 4
  max_new_dependencies: 0
  domain_schema_changes: true
  event_schema_changes: false

dependencies: []
providers: []

verification:
  - name: edition-slice-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_edition.py
      - tests/application/test_edition_projector.py
      - tests/application/test_app_book_compiler.py
      - tests/infrastructure/test_html_edition_renderer.py
      - tests/application/test_content_block_flow.py
      - tests/application/test_apply_approved_patch.py
      - -q
  - name: platform-suite-strict
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - -W
      - error
      - -q

permissions:
  commit: false
  push: false

deliverables:
  - immutable EditionSnapshot projected from approved Work content
  - deterministic AppBookPackage v1 with manifest and checksums
  - static readable HTML rendered from the same snapshot
  - explicit rejection of empty or non-publishable editions
  - focused evidence with a realistic multiblock work

completion:
  requires_all_verification: true
  evidence_update: manual
  advance_next_cycle: false
