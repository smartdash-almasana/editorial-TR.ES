schema_version: editorial.tres/cycle-v1
id: PC-0
capability: editorial.textual-analysis
objective: build_traceable_editorial_finding_contract_for_correction_and_literary_alignment_v1
status: CLOSED_PASS

allowed_paths:
  - capabilities/textual-analysis/**
  - ops/ACTIVE_TASK.yaml
  - platform/src/editorial_tres/domain/reviews.py
  - platform/tests/domain/test_editorial_diagnostic_findings.py
  - docs/architecture/EDITORIAL_TRES_ENGINEERING_STATE.md

forbidden_paths:
  - AGENTS.md
  - tools/**
  - capabilities/global-repetition/**
  - capabilities/edition-slice/**
  - capabilities/private-factory-pilot/**
  - platform/src/editorial_tres/domain/text_analysis.py
  - platform/src/editorial_tres/domain/finding_decisions.py
  - platform/src/editorial_tres/domain/editorial_passes.py
  - platform/src/editorial_tres/domain/patches.py
  - platform/src/editorial_tres/domain/work.py
  - platform/src/editorial_tres/domain/graphs/**
  - platform/src/editorial_tres/application/**
  - platform/src/editorial_tres/infrastructure/**
  - platform/tests/lab_experiment_001_casa_del_rio.py
  - platform/tests/lab_real_text_001_el_hambre_de_los_muertos.py
  - platform/tests/lab_real_text_002_el_perro_mas_listo.py
  - platform/tests/lab_real_text_003_corazon_piedra_verde.py
  - platform/tests/pilots/**
  - plugins/**
  - projects/**
  - constitution/**
  - .github/**
  - platform/pyproject.toml

change_budget:
  max_production_files: 1
  max_new_dependencies: 0
  domain_schema_changes: true
  event_schema_changes: false

dependencies:
  - ReviewFinding
  - TextAnalysisSnapshot
  - TextSpan
  - FindingDecision
providers: []

verification:
  - name: editorial-diagnostic-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_editorial_diagnostic_findings.py
      - -q
  - name: editorial-diagnostic-neighbor
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_reviews.py
      - tests/domain/test_text_analysis.py
      - tests/domain/test_finding_decisions.py
      - tests/domain/test_literary_reviewers.py
      - -q
  - name: platform-suite-strict
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - -W
      - error
      - -q

permissions:
  commit: true
  push: true

deliverables:
  - backward-compatible ReviewFinding contract for legacy block findings
  - explicit diagnostic axis separating normative correction from literary alignment
  - editorial classification separating verified error inconsistency probable issue stylistic suggestion and authorial choice
  - versioned criterion identity and declared certainty
  - optional exact TextAnalysisSnapshot and TextSpan binding
  - exact evidence validation against the bound span
  - immutable replacement proposals that never mutate Work or become Patch automatically
  - deterministic finding identity derived from scope criterion span evidence and proposals
  - explicit rejection of partial stale or cross-scope textual bindings
  - no grammar engine no provider no plugin no automatic correction in this cycle
  - engineering evidence update only after successful verification

completion:
  requires_all_verification: true
  evidence_update: manual
  advance_next_cycle: false
