schema_version: editorial.tres/cycle-v1
id: PC-1
capability: editorial.textual-analysis
objective: build_dependency_free_span_traceable_spanish_orthographic_and_orthotypographic_corrector_v1
status: CLOSED_PASS

allowed_paths:
  - capabilities/textual-analysis/**
  - ops/ACTIVE_TASK.yaml
  - platform/src/editorial_tres/domain/proofreading.py
  - platform/tests/domain/test_spanish_orthotypographic_corrector.py
  - docs/architecture/EDITORIAL_TRES_ENGINEERING_STATE.md

forbidden_paths:
  - AGENTS.md
  - tools/**
  - capabilities/global-repetition/**
  - capabilities/edition-slice/**
  - capabilities/private-factory-pilot/**
  - platform/src/editorial_tres/domain/reviews.py
  - platform/src/editorial_tres/domain/text_analysis.py
  - platform/src/editorial_tres/domain/finding_decisions.py
  - platform/src/editorial_tres/domain/editorial_passes.py
  - platform/src/editorial_tres/domain/patches.py
  - platform/src/editorial_tres/domain/work.py
  - platform/src/editorial_tres/domain/graphs/**
  - platform/src/editorial_tres/application/**
  - platform/src/editorial_tres/infrastructure/**
  - platform/tests/lab_experiment_001_casa_del_rio.py
  - platform/tests/lab_real_text_001_el_hambre_de_los_muertos.py
  - platform/tests/lab_real_text_002_el_perro_mas_listo.py
  - platform/tests/lab_real_text_003_corazon_piedra_verde.py
  - platform/tests/pilots/**
  - plugins/**
  - projects/**
  - constitution/**
  - .github/**
  - platform/pyproject.toml

change_budget:
  max_production_files: 1
  max_new_dependencies: 0
  domain_schema_changes: false
  event_schema_changes: false

dependencies:
  - TextAnalysisSnapshot
  - TextSpan
  - ReviewFinding
  - TextualFindingBinding
  - EditorialCriterion
  - ReplacementProposal
providers: []

verification:
  - name: spanish-orthotypographic-corrector-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_spanish_orthotypographic_corrector.py
      - -q
  - name: spanish-orthotypographic-corrector-neighbor
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_editorial_diagnostic_findings.py
      - tests/domain/test_text_analysis.py
      - tests/domain/test_reviews.py
      - -q
  - name: platform-suite-strict
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - -W
      - error
      - -q

permissions:
  commit: true
  push: true

deliverables:
  - dependency-free SpanishOrthotypographicCorrector over one immutable TextAnalysisSnapshot
  - explicit immutable rule registry with unique versioned criterion identities
  - deterministic rules for repeated horizontal whitespace inside sentences
  - deterministic rules for whitespace before Spanish closing punctuation
  - deterministic rules for missing whitespace after comma semicolon or colon before a letter
  - deterministic rules for whitespace immediately inside Spanish angle quotation marks
  - configurable exact-token lexical corrections intended for governed Archivo Oro entries
  - normative ReviewFinding output bound to canonical PT-0 sentence or token spans
  - deterministic finding order by reading order span position and criterion identity
  - no Work mutation no Patch creation no automatic correction
  - no grammar inference no literary alignment no provider no plugin no new dependency
  - no conflict arbitration between accepted proposals in this cycle
  - engineering evidence update only after successful verification

completion:
  requires_all_verification: true
  evidence_update: manual
  advance_next_cycle: false
