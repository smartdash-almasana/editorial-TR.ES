      - tests/domain/test_spanish_orthotypographic_corrector.py
      - tests/domain/test_spanish_grammar_corrector.py
      - tests/domain/test_spanish_gold_corpus.py
      - -q

permissions:
  commit: true
  push: true

evaluation_protocol:
  frozen_product_head: 3adea17be6773c04e6de8ff798aaba144b9fca60
  corpus_kind: new_complete_held_out_spanish_texts
  minimum_text_count: 3
  reuse_previous_lab_texts: false
  reuse_controlled_corpus: false
  freeze_texts_and_annotations_before_first_run: true
  require_complete_gold_annotation: true
  require_clean_controls: true
  require_voice_preservation_review: true
  require_exact_span_and_replacement_match: true
  allow_product_code_changes: false
  allow_rule_additions: false
  allow_automatic_correction: false

deliverables:
  - at least three complete Spanish texts not used by PC-1 through PC-5 or LAB-PC-1
  - explicit provenance and immutable hashes for every evaluated text
  - complete human gold annotation frozen before the first corrector execution
  - clean passages and deliberate literary voice retained as negative controls
  - current integrated correctors executed without configuration or rule changes
  - exact per-text inventory of true positives false positives omissions and ambiguous cases
  - global precision recall and F1 plus separate recall for the declared governed rule catalog
  - explicit count and examples of dangerous corrections that alter valid meaning voice or dialect
  - immutable Work and source verification with no Patch and no automatic correction
  - report that distinguishes measured sufficiency from product-wide claims
  - evidence-backed decision to freeze the bounded corrector or open only gaps demonstrated by this corpus
  - no product code no dependency no provider no LLM and no plugin

