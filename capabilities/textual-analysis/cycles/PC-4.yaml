  - TextAnalysisSnapshot
  - TextSpan
  - ReviewFinding
  - TextualFindingBinding
  - EditorialCriterion
  - ReplacementProposal
  - SpanishOrthotypographicCorrector
  - LexicalCorrection
providers: []

verification:
  - name: contextual-accent-correction-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_spanish_orthotypographic_corrector.py
      - -q
  - name: spanish-gold-corpus-regression
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_spanish_gold_corpus.py
      - -q
      - -s
  - name: grammar-neighbor-regression
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_spanish_grammar_corrector.py
      - -q

permissions:
  commit: true
  push: true

deliverables:
  - immutable governed contextual accent correction registry
  - exact source-token and replacement proposal with explicit criterion identity
  - bounded same-sentence left or right token anchors without unrestricted regex or parser
  - deterministic matching only when one declared context is satisfied
  - four PC-3 contextual-accent omissions promoted to supported cases
  - all three valid unaccented negative controls retained without findings
  - controlled corpus recall raised from 0.65 to 0.85 if and only if all four cases pass
  - zero unexpected findings and zero control false positives
  - immutable source fixture snapshot and Work
  - no Patch creation no automatic correction no grammar expansion
  - no generic morphology no LLM no provider no plugin no dependency
  - explicit retention of impersonal haber dequeism and word segmentation for later separate cycles

