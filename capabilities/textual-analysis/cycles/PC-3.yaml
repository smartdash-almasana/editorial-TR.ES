change_budget:
  max_production_files: 0
  max_new_dependencies: 0
  domain_schema_changes: false
  event_schema_changes: false

dependencies:
  - TextAnalyzer
  - TextAnalysisSnapshot
  - SpanishOrthotypographicCorrector
  - SpanishGrammarCorrector
  - LexicalCorrection
  - SimpleAgreementRule
providers: []

verification:
  - name: spanish-gold-corpus-focal
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_spanish_gold_corpus.py
      - -q
      - -s
  - name: pc1-pc2-regression
    cwd: platform
    command:
      - python
      - -m
      - pytest
      - tests/domain/test_spanish_orthotypographic_corrector.py
      - tests/domain/test_spanish_grammar_corrector.py
      - -q

permissions:
  commit: true
  push: true

deliverables:
  - byte-identical repository fixture copied from the user-provided short story with errors
  - separate versioned Gold annotation with exact block-relative spans source fragments categories corrections and adjudication
  - explicit negative and ambiguous controls that must not count as errors
  - deterministic execution through the integrated PT-0 PC-1 and PC-2 APIs
  - governed configuration of existing lexical and simple-agreement registries from Gold entries without hardcoding them inside either corrector
  - per-case accounting of true positives omissions unexpected findings and false positives
  - metrics reported both overall and by supported versus unsupported rule family
  - no fabricated product-wide accuracy claim from one controlled corpus
  - source fixture snapshot and Work remain immutable
  - no Patch creation no automatic correction no product code change no dependency no provider no LLM and no plugin
  - explicit statement that Christian genre voice doctrine and theological alignment remain outside PC-3

